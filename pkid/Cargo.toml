[package]
name = "pkid"
description = "The Peios certificate authority service."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# authd's identity socket: who owns a principal name, and display names.
auth-core = { git = "https://github.com/peios/authd.git", rev = "aca253873bf86838f0510920759fc9f5436d2b6f", features = ["client"] }
libc = "0.2"
peios.workspace = true
peios-crypto.workspace = true
pki-core = { path = "../pki-core" }
pki-keys = { path = "../pki-keys" }
pki-management = { path = "../pki-management" }
pki-pipeline = { path = "../pki-pipeline" }
pki-policy = { path = "../pki-policy" }
pki-store = { path = "../pki-store" }
pkid-core = { path = "../pkid-core" }
time.workspace = true

[dev-dependencies]
pki-keys = { path = "../pki-keys" }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
time = { workspace = true, features = ["macros"] }
x509-parser.workspace = true
