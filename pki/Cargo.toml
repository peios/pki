[package]
name = "pki"
description = "The pki command: manage the Peios certificate authority."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The pki command, or with the window feature also the Certificate
# Authority window, `pki --window`.
[features]
default = []
window = ["dep:auth-core", "dep:gxwi", "dep:gxwi-file-dialog", "dep:gxwi-sd-editor", "dep:peinit2"]

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "wrap_help"] }
libc = "0.2"
peios.workspace = true
peios-crypto.workspace = true
pem.workspace = true
pki-core = { path = "../pki-core" }
pki-keys = { path = "../pki-keys" }
pki-management = { path = "../pki-management" }
pki-policy = { path = "../pki-policy" }
pkid-client = { path = "../pkid-client" }
pkid-core = { path = "../pkid-core" }
serde_json = "1"
time = { workspace = true, features = ["formatting"] }
x509-parser.workspace = true
zeroize = "1.8"
# Display names of requesters and officers, from authd.
auth-core = { git = "https://github.com/peios/authd.git", rev = "327ce68648e1594331c88a457afb261f9000b4c3", features = ["client"], optional = true }
# Starting and stopping pkid and pki-httpd, as the caller may.
peinit2 = { git = "https://github.com/peios/peinit.git", rev = "8ff7155b87e1f8c03ce78baf64d8d7b5425fbe3a", default-features = false, optional = true }
gxwi = { git = "https://github.com/peios/gxwi.git", rev = "0cdbd97c86ca0e78138c6b320d88d5be8e2a6407", optional = true }
gxwi-file-dialog = { git = "https://github.com/peios/gxwi-essentials.git", rev = "56e95100671a6b80ff98b62a00385c84bb88defb", default-features = false, optional = true }
gxwi-sd-editor = { git = "https://github.com/peios/gxwi-essentials.git", rev = "56e95100671a6b80ff98b62a00385c84bb88defb", default-features = false, features = ["registry", "splice"], optional = true }
