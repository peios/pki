[package]
name = "pki"
description = "The pki command: manage the Peios certificate authority."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The pki command, or with the window feature also the Certificate
# Authority window, `pki --window`.
[features]
default = []
window = ["dep:auth-core", "dep:gxwi", "dep:gxwi-file-dialog", "dep:gxwi-sd-editor"]

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "wrap_help"] }
libc = "0.2"
peios.workspace = true
peios-crypto.workspace = true
pem.workspace = true
pki-core = { path = "../pki-core" }
pki-keys = { path = "../pki-keys" }
pki-management = { path = "../pki-management" }
pki-policy = { path = "../pki-policy" }
pkid-client = { path = "../pkid-client" }
pkid-core = { path = "../pkid-core" }
serde_json = "1"
time = { workspace = true, features = ["formatting"] }
x509-parser.workspace = true
zeroize = "1.8"
# Display names of requesters and officers, from authd.
auth-core = { git = "https://github.com/peios/authd.git", rev = "af3f0df00b94bf578b27788fc2682d795fe46505", features = ["client"], optional = true }
# Starting and stopping pkid and pki-httpd, as the caller may.
peinit2 = { git = "https://github.com/peios/peinit.git", rev = "f03f61759a2cd7941e84452984ba0e1b613d1559", default-features = false }
gxwi = { git = "https://github.com/peios/gxwi.git", rev = "a8a92eb6f9127319310b3f8ad2c31f436a1f9281", optional = true }
gxwi-file-dialog = { git = "https://github.com/peios/gxwi-essentials.git", rev = "7b641ee2601a34920b5d8f468bc3597efc9b17c1", default-features = false, optional = true }
gxwi-sd-editor = { git = "https://github.com/peios/gxwi-essentials.git", rev = "7b641ee2601a34920b5d8f468bc3597efc9b17c1", default-features = false, features = ["registry", "splice"], optional = true }
