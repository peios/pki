[workspace]
resolver = "2"
members = ["pki-core", "pki-policy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
pem = "4"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "x509-parser"] }
ring = "=0.17.14"
rustls-pki-types = "1.4.1"
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "alloc", "ring"] }
time = { version = "0.3", default-features = false, features = ["std"] }
x509-parser = { version = "0.18.1", features = ["verify"] }
yasna = "0.6"
zeroize = "1.9"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 2
incremental = false
