[workspace]
resolver = "2"
members = [
    "pki-core", "pki-keys", "pki-pipeline", "pki-policy", "pki-store",
    "pki", "pki-management", "pkid", "pkid-core", "pkid-client",
]
# The portable crates. pki and the pkid crates link libpeios, which pekit places for
# them (`native_crates()` in build.gcsl); plain Cargo builds only these.
default-members = ["pki-core", "pki-keys", "pki-pipeline", "pki-policy", "pki-store"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# peios-crypto is pki's only cryptography provider: pki uses rcgen and
# x509-parser only to encode and parse. rcgen runs without a crypto backend.
# x509-parser keeps verify-aws solely because rcgen's x509-parser feature
# doesn't compile without a verify feature; pki never calls it. Tests enable
# more where an independent implementation helps.
peios-crypto = { git = "https://github.com/peios/peios-rs.git", rev = "fcf9a9341dfcff28eece119dfaffcacf2b2abf62" }
# The same commit as peios-crypto and as pekit.lock's peios-rs library, which
# places libpeios for it: the rust library refuses a mismatch.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "fcf9a9341dfcff28eece119dfaffcacf2b2abf62" }
pem = "4"
rcgen = { version = "=0.14.10", default-features = false, features = ["x509-parser"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rustls-pki-types = "1.4.1"
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "alloc", "aws-lc-rs"] }
time = { version = "0.3", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
x509-parser = { version = "0.18.1", features = ["verify-aws"] }
yasna = "0.6"

[profile.dev]
debug = 0
incremental = false

# Passphrase sealing runs Argon2id with 64 MiB; unoptimised, each test seal
# would take seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
debug = 2
incremental = false
